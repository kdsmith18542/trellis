name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Trellis.sln

      - name: Build
        run: dotnet build Trellis.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Trellis.Tests --configuration Release --no-restore --no-build --verbosity normal

  pack:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Trellis.sln

      - name: Build
        run: dotnet build Trellis.sln --configuration Release --no-restore

      - name: Pack
        run: |
          dotnet pack src/Trellis.Core --configuration Release --no-build -o artifacts
          dotnet pack src/Trellis.Node --configuration Release --no-build -o artifacts
          dotnet pack src/Trellis.CLI --configuration Release --no-build -o artifacts
          dotnet pack src/Trellis.Templates --configuration Release --no-build -o artifacts
          dotnet pack src/Trellis.Wallet --configuration Release --no-build -o artifacts

      - name: Push to NuGet
        run: |
          dotnet nuget push artifacts/*.nupkg `
            --api-key ${{ secrets.NUGET_API_KEY }} `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate
        shell: pwsh
