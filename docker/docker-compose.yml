services:
  node1:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    volumes:
      - ./docker/dev-net/node1/appsettings.json:/app/appsettings.json
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5001

  node2:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    volumes:
      - ./docker/dev-net/node2/appsettings.json:/app/appsettings.json
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5002

  node3:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5003:5003"
    volumes:
      - ./docker/dev-net/node3/appsettings.json:/app/appsettings.json
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5003

  node4:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5004:5004"
    volumes:
      - ./docker/dev-net/node4/appsettings.json:/app/appsettings.json
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5004
